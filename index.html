<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wallet PWA</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <h1>Simple Wallet</h1>

  <!-- Gráficos -->
  <canvas id="graficoIngresosGastos"></canvas>
  <canvas id="graficoCategorias"></canvas>

  <!-- Botón Flotante -->
  <button id="fab" class="fab">+</button>

  <!-- Modal -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <ul class="tabs">
        <li><a href="#ingreso">Ingreso</a></li>
        <li><a href="#gasto">Gasto</a></li>
      </ul>

      <div id="ingreso" class="tab-content">
        <input id="descIngreso" type="text" placeholder="Descripción">
        <input id="montoIngreso" type="number" placeholder="Monto">
        <input id="etiquetaIngreso" type="text" placeholder="Etiqueta">
        <button onclick="guardarMovimiento('ingreso')">Guardar</button>
      </div>

      <div id="gasto" class="tab-content">
        <input id="descGasto" type="text" placeholder="Descripción">
        <input id="montoGasto" type="number" placeholder="Monto">
        <input id="etiquetaGasto" type="text" placeholder="Etiqueta">
        <button onclick="guardarMovimiento('gasto')">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Sección de ahorro -->
  <h2>Metas de ahorro</h2>
  <div>
    <input id="descMeta" type="text" placeholder="Descripción de la meta">
    <input id="montoMeta" type="number" placeholder="Monto objetivo">
    <button onclick="guardarMeta()">Crear meta</button>
  </div>

  <div>
    <input id="idMeta" type="number" placeholder="ID de la meta">
    <input id="montoAhorro" type="number" placeholder="Monto a ahorrar">
    <button onclick="sumarAhorro()">Sumar ahorro</button>
  </div>

  <canvas id="graficoAhorro"></canvas>

  <script src="app.js"></script>
</body>
</html>
