<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wallet PWA</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <!-- Barra superior con branding -->
  <header class="main-header">
    <div class="brand">💸 My Wallet</div>
    <nav class="main-tabs">
      <a href="#wallet" class="active">Wallet</a>
      <a href="#metas">Metas</a>
    </nav>
  </header>

  <!-- Sección Wallet -->
  <div id="wallet" class="tab-section active">
  <div id="tablaMovimientos" class="chart-container">
    <h2>Últimos movimientos</h2>
    <p id="mensajeMovimientos" class="chart-overlay">No hay datos aún</p>
    <table class="movimientos-table">
      <thead>
        <tr>
          <th>Fecha</th>
          <th>Tipo</th>
          <th>Descripción</th>
          <th>Monto</th>
          <th>Categoría</th>
        </tr>
      </thead>
      <tbody id="movimientosBody">
        <!-- filas dinámicas -->
      </tbody>
    </table>
    <button id="verMas" class="btn-vermas">Ver más</button>
  </div>
    <div class="chart-container">
      <canvas id="graficoIngresosGastos"></canvas>
      <div class="chart-overlay">No hay datos aún</div>
    </div>
    <div class="chart-container">
      <canvas id="graficoCategorias"></canvas>
      <div class="chart-overlay">No hay datos aún</div>
    </div>
  </div>

  <!-- Sección Metas -->
  <div id="metas" class="tab-section">
    <h2>Metas de ahorro</h2>
    <div id="listaMetas" class="metas-list">
      <!-- Aquí se renderizan las metas como tarjetas -->
      <!-- Ejemplo:
      <div class="meta-card">
        <h3>Viaje a Japón</h3>
        <canvas class="graficoMeta"></canvas>
        <button class="btn-sumar">Sumar ahorro</button>
      </div>
      -->
    </div>
  </div>

  <!-- Botón Flotante (ahora crea metas en la sección Metas) -->
  <button id="fab" class="fab">+</button>

  <!-- Modal para ingresos/gastos -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <ul class="tabs">
        <li><a href="#ingreso" class="active">Ingreso</a></li>
        <li><a href="#gasto">Gasto</a></li>
      </ul>

      <div id="ingreso" class="tab-content active">
        <input id="descIngreso" type="text" placeholder="Descripción">
        <input id="montoIngreso" type="number" placeholder="Monto">
        <label for="etiquetaIngreso">Categoría:</label>
        <select id="etiquetaIngreso">
          <option value="Sueldo">Sueldo</option>
          <option value="Freelance">Freelance</option>
          <option value="Ventas">Ventas</option>
          <option value="Inversiones">Inversiones</option>
          <option value="Donaciones">Donaciones</option>
          <option value="Otros">Otros Ingresos</option>
        </select>
        <button onclick="guardarMovimiento('ingreso')">Guardar</button>
      </div>

      <div id="gasto" class="tab-content">
        <input id="descGasto" type="text" placeholder="Descripción">
        <input id="montoGasto" type="number" placeholder="Monto">
        <label for="etiquetaGasto">Categoría:</label>
        <select id="etiquetaGasto">
          <option value="Vivienda">Vivienda</option>
          <option value="Transporte">Transporte</option>
          <option value="Alimentación">Alimentación</option>
          <option value="Salud">Salud</option>
          <option value="Educación">Educación</option>
          <option value="Entretenimiento">Entretenimiento</option>
          <option value="Ropa">Ropa y accesorios</option>
          <option value="Ahorro">Ahorro / Inversión</option>
          <option value="Otros">Otros gastos</option>
        </select>
        <button onclick="guardarMovimiento('gasto')">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Modal para crear metas -->
  <div id="modalMeta" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h3>Nueva meta</h3>
      <input id="descMeta" type="text" placeholder="Descripción de la meta">
      <input id="montoMeta" type="number" placeholder="Monto objetivo">
      <button onclick="guardarMeta()">Crear meta</button>
    </div>
  </div>

  <!-- Modal para sumar ahorro -->
  <div id="modalAhorro" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h3>Sumar ahorro</h3>
      <input id="montoAhorro" type="number" placeholder="Monto a ahorrar">
      <button onclick="sumarAhorroSeleccionada()">Guardar</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
